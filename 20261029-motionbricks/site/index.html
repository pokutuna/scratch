<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotionBricks Viewer</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="view"></div>
    <header>
      <h1>MotionBricks Viewer</h1>
      <p>MotionBricks が生成したモーション。ドラッグで回転、ホイールで拡大、右ドラッグで移動。</p>
    </header>
    <div id="panel">
      <div class="row">
        <select id="motion" aria-label="モーション"></select>
        <select id="model" aria-label="モデル">
          <option value="">モデルなし</option>
          <option value="Froggy">Froggy</option>
          <option value="PossumEnjoyer">PossumEnjoyer</option>
        </select>
        <span id="step"></span>
      </div>
      <div class="row">
        <button id="play" type="button" aria-label="再生">⏸</button>
        <input id="seek" type="range" min="0" value="0" aria-label="フレーム" />
        <span id="time">0.00 s</span>
      </div>
      <div class="row options">
        <label>
          速度
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
          </select>
        </label>
        <label><input id="follow" type="checkbox" checked /> カメラを追従</label>
        <label><input id="ghost" type="checkbox" checked /> 目標の姿勢</label>
        <label><input id="trail" type="checkbox" /> 腰の軌跡</label>
      </div>
      <p class="legend">
        <span class="swatch context"></span>最初の文脈
        <span class="swatch generated"></span>生成
        <span class="swatch target"></span>向かっている目標
      </p>
      <p class="credit">
        <span>モデル (CC0、<a href="https://github.com/ToxSam/osa-gallery">Open Source Avatars</a>):</span>
        <span>Froggy by <a href="https://www.polygonalmind.com/">Polygonal Mind</a>,</span>
        <span>Possum Enjoyer by <a href="https://opensourceavatars.com/">opensourceavatars.com</a></span>
      </p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
